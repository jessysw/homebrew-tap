name: Merge verified release formula
on:
  workflow_run:
    workflows: ['Formula CI']
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # This privileged workflow never checks out or executes PR content.
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            if (run.head_repository?.full_name !== `${repo.owner}/${repo.repo}`) return;
            if (!/^contitext-v\d+\.\d+\.\d+$/.test(run.head_branch)) return;
            const {data: prs} = await github.rest.pulls.list({...repo, head: `${repo.owner}:${run.head_branch}`, base: 'main', state: 'open'});
            if (prs.length !== 1) return;
            const pr = prs[0];
            if (pr.user.login !== 'jessysw' || pr.head.sha !== run.head_sha || pr.head.repo.full_name !== `${repo.owner}/${repo.repo}`) return;
            const files = await github.paginate(github.rest.pulls.listFiles, {...repo, pull_number: pr.number});
            if (files.length !== 1 || files[0].filename !== 'Formula/contitext.rb' || files[0].status !== 'modified') return;
            await github.rest.pulls.merge({...repo, pull_number: pr.number, sha: run.head_sha, merge_method: 'squash'});
